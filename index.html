<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-GIRL Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }
    #video-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: transparent;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      pointer-events: none;
    }
    .controls {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      opacity: 0;
      transition: opacity 0.2s;
      -webkit-app-region: drag;
      z-index: 10;
    }
    body:hover .controls,
    .controls:hover {
      opacity: 1;
    }
    .controls button {
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      -webkit-app-region: no-drag;
    }
    .controls button:hover {
      background: rgba(255, 255, 255, 0.45);
    }
    .controls input[type="range"] {
      width: 80px;
      -webkit-app-region: no-drag;
    }
    .status {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .status.show { opacity: 1; }
    .drop-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .drop-hint.hidden { display: none; }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="player" autoplay loop muted playsinline></video>
    <div class="drop-hint" id="hint">Drop a video here or click Open</div>
  </div>

  <div class="controls">
    <div>
      <button id="open-btn">Open</button>
      <button id="clickthrough-btn">Click-Through: OFF</button>
    </div>
    <div>
      <label style="color:white;font-size:11px;">Opacity</label>
      <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="1">
    </div>
    <button id="close-btn">✕</button>
  </div>

  <div class="status" id="status"></div>

  <script>
    const video = document.getElementById('player');
    const hint = document.getElementById('hint');
    const status = document.getElementById('status');
    const openBtn = document.getElementById('open-btn');
    const clickthroughBtn = document.getElementById('clickthrough-btn');
    const opacitySlider = document.getElementById('opacity');
    const closeBtn = document.getElementById('close-btn');

    function showStatus(msg) {
      status.textContent = msg;
      status.classList.add('show');
      setTimeout(() => status.classList.remove('show'), 2500);
    }

    openBtn.addEventListener('click', () => {
      window.electronAPI.openVideo();
    });

    clickthroughBtn.addEventListener('click', () => {
      window.electronAPI.toggleClickThrough();
    });

    opacitySlider.addEventListener('input', (e) => {
      window.electronAPI.setOpacity(parseFloat(e.target.value));
    });

    closeBtn.addEventListener('click', () => {
      window.electronAPI.closeApp();
    });

    window.electronAPI.onLoadVideo((filePath) => {
      // Use custom protocol for better compatibility
      const encoded = encodeURIComponent(filePath);
      video.src = `local-video://${encoded}`;
      video.play().catch(err => {
        console.error('Play error:', err);
        showStatus('Could not play video');
      });
      hint.classList.add('hidden');
      showStatus('Video loaded');
    });

    window.electronAPI.onClickThroughChanged((state) => {
      clickthroughBtn.textContent = `Click-Through: ${state ? 'ON' : 'OFF'}`;
      showStatus(`Click-through ${state ? 'enabled' : 'disabled'}`);
    });

    // Drag and drop
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    document.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const file = files[0];
        if (file.path) {
          const encoded = encodeURIComponent(file.path);
          video.src = `local-video://${encoded}`;
          video.play().catch(() => {});
          hint.classList.add('hidden');
          showStatus('Video loaded');
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key === 'T') {
        window.electronAPI.toggleClickThrough();
      }
      if (e.key === 'Escape') {
        window.electronAPI.closeApp();
      }
    });
  </script>
</body>
</html>
